<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js" type="module"></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="/images/banner-sm.jpg 500w, /images/banner.jpg 1200w"
          alt="Outdoor camping landscape"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent logo" />
          <h2>Sleep<span class="highlight">Outside</span></h2>
        </div>
      </div>

      <section class="products">
        <h2>Shop by Category</h2>
        <ul class="product-grid category-grid">
          <li class="category-card">
            <a href="/product-listing/index.html?category=tents">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="category-icon" width="60" height="60">
                <path d="M50 15 L10 85 L90 85 Z M50 15 L50 85" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
              </svg>
              <h3>Tents</h3>
            </a>
          </li>
          <li class="category-card">
            <a href="/product-listing/index.html?category=backpacks">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="category-icon" width="60" height="60">
                <rect x="25" y="25" width="50" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="6"/>
                <path d="M35 25 V15 A15 15 0 0 1 65 15 V25" fill="none" stroke="currentColor" stroke-width="6"/>
                <rect x="35" y="45" width="30" height="25" rx="4" fill="none" stroke="currentColor" stroke-width="4"/>
              </svg>
              <h3>Backpacks</h3>
            </a>
          </li>
          <li class="category-card">
            <a href="/product-listing/index.html?category=sleeping-bags">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="category-icon" width="60" height="60">
                <rect x="25" y="15" width="50" height="75" rx="20" fill="none" stroke="currentColor" stroke-width="6"/>
                <line x1="25" y1="35" x2="75" y2="35" stroke="currentColor" stroke-width="6"/>
              </svg>
              <h3>Sleeping Bags</h3>
            </a>
          </li>
          <li class="category-card">
            <a href="/product-listing/index.html?category=hammocks">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="category-icon" width="60" height="60">
                <path d="M10 30 Q50 80 90 30 Q50 65 10 30 Z" fill="none" stroke="currentColor" stroke-width="6"/>
                <line x1="10" y1="30" x2="5" y2="15" stroke="currentColor" stroke-width="4"/>
                <line x1="90" y1="30" x2="95" y2="15" stroke="currentColor" stroke-width="4"/>
              </svg>
              <h3>Hammocks</h3>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
