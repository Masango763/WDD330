<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9C46A" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon Background Circle -->
  <circle cx="35" cy="35" r="28" fill="#143628" stroke="#2D6A4F" stroke-width="1.5" />
  
  <!-- Digital Pulse / Horizon Arc -->
  <path d="M 18 42 Q 28 22 38 42 T 52 32" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Sprouting Maize / Leaf Element -->
  <path d="M 35 48 C 35 38, 25 32, 22 25 C 28 25, 38 32, 35 48 Z" fill="url(#leafGrad)" />
  <path d="M 35 48 C 35 38, 45 32, 48 25 C 42 25, 32 32, 35 48 Z" fill="#52B788" opacity="0.85" />
  <line x1="35" y1="48" x2="35" y2="22" stroke="#E9C46A" stroke-width="2" stroke-linecap="round" />

  <!-- Typography: AgriPulse (High visibility white/gold) -->
  <text x="78" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF">Agri<tspan fill="#E9C46A">Pulse</tspan></text>
  
  <!-- Typography: ZIMBABWE Subtitle -->
  <text x="79" y="48" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="10" fill="#E9C46A" letter-spacing="3.5">ZIMBABWE</text>
</svg>
